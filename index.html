<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMatch | Movie Recommendations</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header class="navbar">
    <div class="logo">🎬 CineMatch</div>
    <div style="display: flex; gap: 20px; align-items: center;">
        <a href="/" class="nav-link" style="color: #c4b5fd; text-decoration: none;">Home</a>
        <a href="/watchlist" class="nav-link" style="color: #c4b5fd; text-decoration: none; font-weight: bold;">⭐ My Watchlist</a>
    </div>
</header>

<section class="hero">
    <div class="hero-content">
        <p class="tagline">YOUR PERSONAL MOVIE DISCOVERY PLATFORM</p>

        <h1>Find Your Next<br>
            <span>Favourite Movie</span>
        </h1>

        <p class="hero-text">
            Discover movies based on your favourite industry
            and genre. Explore Bollywood and Hollywood picks
            in one place.
        </p>

        <form action="/recommend" method="POST" class="filter-form">

            <div class="form-group">
                <label for="industry">Choose Movie Industry</label>
                <select name="industry" id="industry">
                    <option value="All">All Industries</option>
                    <option value="Bollywood">Bollywood</option>
                    <option value="Hollywood">Hollywood</option>
                </select>
            </div>

            <div class="form-group">
                <label for="genre">Choose Genre</label>
                <select name="genre" id="genre">
                    <option value="All">All Genres</option>
                    <option value="Romance">Romance</option>
                    <option value="Drama">Drama</option>
                    <option value="Comedy">Comedy</option>
                    <option value="Crime">Crime</option>
                    <option value="Thriller">Thriller</option>
                    <option value="Action">Action</option>
                    <option value="Adventure">Adventure</option>
                    <option value="Sports">Sports</option>
                    <option value="Sci-Fi">Sci-Fi</option>
                </select>
            </div>

            <button type="submit" class="explore-btn">
                Explore Movies →
            </button>

        </form>
    </div>
</section>

<footer>
    <p>© 2026 CineMatch | Discover. Explore. Enjoy.</p>
</footer>

</body>
</html>
